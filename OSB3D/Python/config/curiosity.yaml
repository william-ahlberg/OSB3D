---
# PPO Agent YAML Configuration
env:
    game_name: "osb3d"
    headless: false
    no_graphics: false



unity_engine_settings:
    width: 1024
    height: 1024
    quality_level: 1
    time_scale: 50
    target_frame_rate: -1
    capture_frame_rate: 60

env_settings:
    seed: 1
    block_count_x: 2
    block_count_z: 2
    park_ratio: 0.25

action_space_settings:
    continuous_actions: true
    available_actions:
        - move_vertical
        - move_horizontal
        - mouse_y
        - mouse_x
        - jump

observation_space_settings:
    vector_obs_settings:
        position_type: "absolute"
        include_bug_position: false
    semantic_map_settings:
        semantic_map_x: 5
        semantic_map_y: 5
        semantic_map_z: 5
    ray_perception_settings:
        ray_perception_plane: 1
    #camera_settings:
    #    grayscale: true
    #    camera_resolution_width: 128
    #    camera_resolution_height: 128

bug_settings:
    gadget: 1
    state: 1
    geometry: 1
    physics: 1
    logic: 1
...
